<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Click Map Component</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      html, body {
        margin: 0;
        padding: 0;
      }
      #map {
        width: 100%;
        height: 420px;
      }
      .leaflet-container {
        background: #f8f9fb;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/streamlit-component-lib/dist/index.js"></script>
    <script>
      let map = null;
      let marker = null;

      function render(args) {
        const lat = Number(args.initial_lat ?? 37.7749);
        const lon = Number(args.initial_lon ?? -122.4194);
        const zoom = Number(args.initial_zoom ?? 6);

        if (!map) {
          map = L.map("map", { zoomControl: true }).setView([lat, lon], zoom);
          L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors',
          }).addTo(map);

          marker = L.marker([lat, lon], { draggable: false }).addTo(map);

          map.on("click", function (e) {
            const { lat, lng } = e.latlng;
            if (marker) {
              marker.setLatLng([lat, lng]);
            }
            // Return the clicked coordinates to Streamlit
            Streamlit.setComponentValue({ lat: lat, lon: lng });
          });
        } else {
          map.setView([lat, lon], zoom);
          if (marker) marker.setLatLng([lat, lon]);
        }

        // Ensure Streamlit resizes the frame to our content height
        Streamlit.setFrameHeight(430);
      }

      // Listen for render events sent by Streamlit
      Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, (event) => {
        render(event.detail.args);
      });
      // Tell Streamlit that the component is ready to receive events
      Streamlit.setComponentReady();
      // Render with empty args on load just in case
      Streamlit.setFrameHeight(430);
    </script>
  </body>
  </html>
