name: Deploy to Fly.io

on:
  push:
    branches:
      - deploy-app
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
      
      - name: Deploy with Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -e
          echo "Starting Fly.io deploy (verbose)"
          flyctl deploy --remote-only --build-arg BUILDKIT_INLINE_CACHE=1 --verbose || DEPLOY_FAILED=$?
          if [ -n "$DEPLOY_FAILED" ]; then
            echo "Deploy failed with code $DEPLOY_FAILED. Dumping status and logs..."
            flyctl status --app stability-predictor || true
            flyctl logs --app stability-predictor -n 200 || true
            exit $DEPLOY_FAILED
          fi
      
      - name: Health Check
        run: |
          echo "Waiting for deployment to be ready..."
          sleep 30
          curl -f https://stability-predictor.fly.dev/_stcore/health || echo "Health check failed; app may still be starting"