name: Deploy to Fly.io

on:
  push:
    branches:
      - deploy-app
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
        
      - name: Deploy to Fly.io using pre-built image
        run: flyctl deploy --image ghcr.io/al31415/landslide_research:latest --app stability-predictor
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          
      - name: Health Check
        run: |
          echo "Waiting for deployment to be ready..."
          sleep 30
          curl -f https://stability-predictor.fly.dev/health || echo "Health check failed, but deployment may still be starting"
          
      - name: Deployment Summary
        run: |
          echo "🚀 Deployment completed!"
          echo "📱 App URL: https://stability-predictor.fly.dev"
          echo "📊 Fly.io Dashboard: https://fly.io/apps/stability-predictor" 