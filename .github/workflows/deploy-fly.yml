name: Deploy to Fly.io

on:
  push:
    branches:
      - deploy-app
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
      
      - name: Deploy with Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -e
          echo "Starting Fly.io deploy (verbose)"
          flyctl deploy --remote-only --build-arg BUILDKIT_INLINE_CACHE=1 --strategy immediate --verbose || DEPLOY_FAILED=$?
          if [ -n "$DEPLOY_FAILED" ]; then
            echo "Deploy failed with code $DEPLOY_FAILED. Dumping status and logs..."
            flyctl status --app stability-predictor || true
            # Per-machine status (via API for reliable IDs)
            IDS=$(flyctl api get "/v1/apps/stability-predictor/machines" | jq -r '.[]?.id')
            for m in $IDS; do
              echo "\n===== Status for machine $m ====="
              flyctl machine status "$m" --app stability-predictor || true
            done
            exit $DEPLOY_FAILED
          fi

      - name: Ensure single region (ord only)
        if: ${{ success() }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -e
          flyctl regions set ord --app stability-predictor --yes || true

      - name: Right-size existing machines (shared-1x, 2GB RAM, autostop)
        if: ${{ success() }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          set -x
          sudo apt-get update -y >/dev/null 2>&1 || true
          sudo apt-get install -y jq >/dev/null 2>&1 || true
          flyctl version || true
          APP="stability-predictor"
          # List machine IDs via API (compatible across flyctl versions)
          IDS=$(flyctl api get "/v1/apps/$APP/machines" | jq -r '.[]?.id')
          if [ -z "$IDS" ]; then
            IDS=$(flyctl machines list --app "$APP" --json | jq -r '.[].id')
          fi
          echo "$IDS" | while IFS= read -r m; do
            [ -n "$m" ] || continue
            echo "Updating machine $m to shared-1x 2GB with autostop via machine-config"
            tmpcfg=$(mktemp)
            flyctl api get "/v1/apps/$APP/machines/$m" | jq '
              .config // {} 
              | .guest.cpu_kind = "shared"
              | .guest.cpus = 1
              | .guest.memory_mb = 2048
              | .auto_stop = "stop"
            ' > "$tmpcfg"
            cat "$tmpcfg"
            # Apply config; treat no-op updates as success
            flyctl machine update "$m" --app "$APP" --machine-config "$tmpcfg" || true
            rm -f "$tmpcfg"
          done

      - name: Prune extra machines (keep newest only)
        if: ${{ success() }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="stability-predictor"
          # Keep only the most recently updated machine; destroy the rest
          IDS_TO_REMOVE=$(flyctl api get "/v1/apps/$APP/machines" | jq -r 'sort_by(.updated_at // .created_at) | .[0:-1] | .[]?.id')
          for id in $IDS_TO_REMOVE; do
            echo "Destroying extra machine $id"
            flyctl machine destroy "$id" --app "$APP" --force --yes || true
          done
      
      - name: Health Check (poll until healthy)
        run: |
          set -e
          echo "Polling health endpoint..."
          ATTEMPTS=20
          SLEEP=15
          for i in $(seq 1 $ATTEMPTS); do
            if curl -fsS https://stability-predictor.fly.dev/_stcore/health > /dev/null || curl -fsS https://stability-predictor.fly.dev/health > /dev/null; then
              echo "App is healthy."
              exit 0
            fi
            echo "Attempt $i/$ATTEMPTS not healthy yet; sleeping $SLEEP s..."
            sleep $SLEEP
          done
          echo "Health check failed after $ATTEMPTS attempts. Dumping status..."
          flyctl status --app stability-predictor || true
          IDS=$(flyctl api get "/v1/apps/stability-predictor/machines" | jq -r '.[]?.id')
          for m in $IDS; do
            echo "\n===== Status for machine $m ====="
            flyctl machine status "$m" --app stability-predictor || true
          done
          exit 1