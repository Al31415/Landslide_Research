name: Deploy to Fly.io

on:
  push:
    branches:
      - deploy-app
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
      
      - name: Deploy with Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -e
          echo "Starting Fly.io deploy (verbose)"
          flyctl deploy --remote-only --build-arg BUILDKIT_INLINE_CACHE=1 --verbose || DEPLOY_FAILED=$?
          if [ -n "$DEPLOY_FAILED" ]; then
            echo "Deploy failed with code $DEPLOY_FAILED. Dumping status and logs..."
            flyctl status --app stability-predictor || true
            flyctl logs --app stability-predictor --no-tail --since 1h || true
            # Attempt per-machine logs for deeper detail
            MACHINES=$(flyctl machines list --app stability-predictor | awk 'NR>1 {print $1}')
            for m in $MACHINES; do
              echo "\n===== Logs for machine $m ====="
              flyctl logs --app stability-predictor --machine "$m" --no-tail --since 1h || true
              echo "\n===== Status for machine $m ====="
              flyctl machine status "$m" --app stability-predictor || true
            done
            exit $DEPLOY_FAILED
          fi

      - name: Ensure single region (ord only)
        if: ${{ success() }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -e
          flyctl regions set ord --app stability-predictor --yes || true

      - name: Right-size existing machines (shared-1x, 2GB RAM, autostop)
        if: ${{ success() }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          set -x
          sudo apt-get update -y >/dev/null 2>&1 || true
          sudo apt-get install -y jq >/dev/null 2>&1 || true
          flyctl version || true
          # Iterate IDs line-by-line to avoid word-splitting issues
          while IFS= read -r m; do
            [ -n "$m" ] || continue
            echo "Updating machine $m to shared-1x 2GB with autostop"
            # Prefer new flags; fallback to legacy flags; if both fail, update via machine-config JSON
            if ! flyctl machine update "$m" --app stability-predictor --vm-cpu-kind shared --vm-cpus 1 --vm-memory 2048 --autostop=stop; then
              if ! flyctl machine update "$m" --app stability-predictor --vm-cpu-kind shared --cpus 1 --memory 2048 --autostop stop; then
                echo "Flag-based update failed; attempting --machine-config update for $m"
                tmpcfg=$(mktemp)
                flyctl machine status "$m" --app stability-predictor --json | jq '.config \
                  | .guest.cpu_kind="shared" \
                  | .guest.cpus=1 \
                  | .guest.memory_mb=2048 \
                  | .auto_stop="stop"' > "$tmpcfg"
                cat "$tmpcfg"
                flyctl machine update "$m" --app stability-predictor --machine-config "$tmpcfg"
                rm -f "$tmpcfg"
              fi
            fi
          done < <(flyctl machines list --app stability-predictor --json | jq -r '.[].id')
      
      - name: Health Check (poll until healthy)
        run: |
          set -e
          echo "Polling health endpoint..."
          ATTEMPTS=20
          SLEEP=15
          for i in $(seq 1 $ATTEMPTS); do
            if curl -fsS https://stability-predictor.fly.dev/_stcore/health > /dev/null || curl -fsS https://stability-predictor.fly.dev/health > /dev/null; then
              echo "App is healthy."
              exit 0
            fi
            echo "Attempt $i/$ATTEMPTS not healthy yet; sleeping $SLEEP s..."
            sleep $SLEEP
          done
          echo "Health check failed after $ATTEMPTS attempts. Dumping status and logs..."
          flyctl status --app stability-predictor || true
          flyctl logs --app stability-predictor --no-tail --since 1h || true
          MACHINES=$(flyctl machines list --app stability-predictor | awk 'NR>1 {print $1}')
          for m in $MACHINES; do
            echo "\n===== Logs for machine $m ====="
            flyctl logs --app stability-predictor --machine "$m" --no-tail --since 1h || true
            echo "\n===== Status for machine $m ====="
            flyctl machine status "$m" --app stability-predictor || true
          done
          exit 1