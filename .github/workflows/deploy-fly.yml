name: Deploy to Fly.io

on:
  push:
    branches:
      - deploy-app
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
      
      - name: Deploy with Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -e
          echo "Starting Fly.io deploy (verbose)"
          flyctl deploy --remote-only --build-arg BUILDKIT_INLINE_CACHE=1 --verbose || DEPLOY_FAILED=$?
          if [ -n "$DEPLOY_FAILED" ]; then
            echo "Deploy failed with code $DEPLOY_FAILED. Dumping status and logs..."
            flyctl status --app stability-predictor || true
            flyctl logs --app stability-predictor -n 200 || true
            exit $DEPLOY_FAILED
          fi
      
      - name: Health Check (poll until healthy)
        run: |
          set -e
          echo "Polling health endpoint..."
          ATTEMPTS=20
          SLEEP=15
          for i in $(seq 1 $ATTEMPTS); do
            if curl -fsS https://stability-predictor.fly.dev/_stcore/health > /dev/null; then
              echo "App is healthy."
              exit 0
            fi
            echo "Attempt $i/$ATTEMPTS not healthy yet; sleeping $SLEEP s..."
            sleep $SLEEP
          done
          echo "Health check failed after $ATTEMPTS attempts. Dumping status and logs..."
          flyctl status --app stability-predictor || true
          flyctl logs --app stability-predictor -n 300 || true
          exit 1