name: Deploy to Fly.io

on:
  push:
    branches:
      - deploy-app
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
        
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --app stability-predictor
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          
      - name: Check deployment status
        run: |
          echo "Deployment completed!"
          echo "App URL: https://stability-predictor.fly.dev"
          flyctl status --app stability-predictor
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
      - name: Wait for deployment
        run: sleep 30
        
      - name: Check app health
        run: |
          echo "Checking app health..."
          curl -f https://stability-predictor.fly.dev/_stcore/health || {
            echo "Health check failed, checking app logs..."
            exit 1
          }
          echo "✅ App is healthy and responding!" 