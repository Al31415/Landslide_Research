name: Build and Deploy to Fly.io

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/al31415/landslide_research:latest
            ghcr.io/al31415/landslide_research:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: build
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
        
      - name: Deploy to Fly.io using pre-built image
        run: flyctl deploy --image ghcr.io/al31415/landslide_research:latest --app stability-predictor
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          
      - name: Health Check
        run: |
          echo "Waiting for deployment to be ready..."
          sleep 30
          curl -f https://stability-predictor.fly.dev/health || echo "Health check failed, but deployment may still be starting"
          
      - name: Deployment Summary
        run: |
          echo "🚀 Build and deployment completed!"
          echo "📱 App URL: https://stability-predictor.fly.dev"
          echo "📊 Fly.io Dashboard: https://fly.io/apps/stability-predictor"
          echo "🐳 Docker Image: ghcr.io/al31415/landslide_research:latest" 